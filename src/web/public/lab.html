<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slop Lab</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* The lab may be ugly (SPEC §28). */
    #app { width: min(960px, 96vw); }
    table.lab { border-collapse: collapse; width: 100%; margin: 0.6rem 0 1.2rem; font-size: 0.85rem; }
    table.lab th, table.lab td { border: 1px solid #33333c; padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
    table.lab th { color: #8b8b85; font-weight: 400; }
    pre { background: #17171d; border: 1px solid #33333c; padding: 0.6rem; overflow-x: auto; font-size: 0.8rem; }
    .round-link { display: block; background: none; border: none; color: #6b6bff; cursor: pointer; padding: 0.2rem 0; text-align: left; font: inherit; margin: 0; }
    .human-row { background: #14241a; }
    h3 { margin-top: 1.6rem; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main id="app">
    <h1>SLOP LAB</h1>
    <p class="dim">Developer-only debug surface. Hidden state, raw ballots, events. <a href="/" style="color:#6b6bff">← back to the game</a></p>
    <section id="round-list"></section>
    <section id="round-detail"></section>
  </main>
  <script src="/lab.js"></script>
</body>
</html>
