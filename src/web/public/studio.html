<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slop Studio</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* The studio may be ugly (SPEC §28 spirit, like the lab). */
    #app { width: min(960px, 96vw); }
    table.lab { border-collapse: collapse; width: 100%; margin: 0.6rem 0 1.2rem; font-size: 0.85rem; }
    table.lab th, table.lab td { border: 1px solid #33333c; padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
    table.lab th { color: #8b8b85; font-weight: 400; }
    h3 { margin-top: 1.6rem; letter-spacing: 0.08em; }
    .inactive-row { color: #8b8b85; }
    .row-btn { font-size: 0.75rem; padding: 0.15rem 0.4rem; margin-right: 0.3rem; }
    #new-prompt-text, #editor-text { width: 100%; min-height: 3.2rem; margin: 0.4rem 0; }
    #status { min-height: 1.2rem; }
    .run { border: 1px solid #33333c; background: #17171d; padding: 0.6rem; margin: 0.6rem 0; }
    .run .specimen { margin: 0.5rem 0; padding-left: 0.6rem; border-left: 2px solid #33333c; }
  </style>
</head>
<body>
  <main id="app">
    <h1>SLOP STUDIO</h1>
    <p class="dim">Developer-only authoring surface. Author and curate prompts, run the machine table against them.
      <a href="/" style="color:#6b6bff">← game</a> · <a href="/lab" style="color:#6b6bff">lab</a></p>
    <p id="status" class="dim"></p>

    <section>
      <h3>NEW PROMPT</h3>
      <textarea id="new-prompt-text" placeholder="Write a prompt contestants will answer..."></textarea>
      <button id="new-prompt-save">Add prompt</button>
    </section>

    <section id="editor" hidden>
      <h3>EDIT PROMPT <span id="editor-id" class="dim"></span></h3>
      <p class="dim">Saving creates a descendant prompt and deactivates this one.</p>
      <textarea id="editor-text"></textarea>
      <button id="editor-save">Save as new version</button>
      <button id="editor-cancel">Cancel</button>
    </section>

    <section id="prompts"></section>
    <section id="runs"></section>
  </main>
  <script src="/studio.js"></script>
</body>
</html>
