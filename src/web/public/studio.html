<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slop Studio</title>
  <link rel="stylesheet" href="/developer.css" />
  <link rel="stylesheet" href="/studio.css" />
</head>
<body>
  <main id="app">
    <h1>SLOP STUDIO</h1>
    <p class="dim">Developer-only authoring surface. Author and curate prompts, run the machine table against them.
      <a href="/">← game</a> · <a href="/lab">lab</a></p>
    <p id="status" class="dim"></p>

    <section>
      <h3>NEW PROMPT</h3>
      <textarea id="new-prompt-text" placeholder="Write a prompt contestants will answer..."></textarea>
      <button id="new-prompt-save">Add prompt</button>
    </section>

    <section id="editor" hidden>
      <h3>EDIT PROMPT <span id="editor-id" class="dim"></span></h3>
      <p class="dim">Saving creates a descendant prompt and deactivates this one.</p>
      <textarea id="editor-text"></textarea>
      <button id="editor-save">Save as new version</button>
      <button id="editor-cancel">Cancel</button>
    </section>

    <section id="prompts"></section>
    <section id="runs"></section>
  </main>
  <script src="/studio.js"></script>
</body>
</html>
